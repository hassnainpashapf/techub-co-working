<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a14" />
<title>You're offline — Techub Coworking</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0a0a14; color: #e2e8f0; font-family: Inter, system-ui, sans-serif;
    padding: 24px; text-align: center;
  }
  .card {
    max-width: 380px; width: 100%; padding: 40px 32px; border-radius: 20px;
    background: linear-gradient(160deg, #1c1c30, #12121f);
    border: 1px solid rgba(124,58,237,.35);
    box-shadow: 0 0 60px rgba(124,58,237,.25);
  }
  .icon { font-size: 52px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 8px; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #7c3aed, #3b82f6); color: #fff;
    font-size: 15px; font-weight: 700;
  }
  button:hover { opacity: .92; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
